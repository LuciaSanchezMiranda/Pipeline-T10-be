server:
  port: 8080  # Valor por defecto si PORT no está configurado 
  

spring:
  datasource:
    url: jdbc:sqlserver://54.160.47.11:1433;databaseName=AgroPacayales;encrypt=true;trustServerCertificate=true  ## Cambiar "model" por tu base de datos
    username: sa          ## Cambiar por tu usuario
    password: TuPassword123!  ## Cambiar por tu contraseña
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
